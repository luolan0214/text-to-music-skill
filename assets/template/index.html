<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>或许</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f14; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
         font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
  canvas { height: min(84vh, calc((100vw - 32px) * 4 / 3)); aspect-ratio: 3 / 4; border-radius: 6px; cursor: pointer; }
  .bar { display: flex; gap: 10px; }
  button { font: inherit; font-size: 14px; color: #d8dce4; background: transparent; border: 1px solid #3a4150;
           border-radius: 999px; padding: 7px 18px; cursor: pointer; }
  button:hover { border-color: #8a93a6; }
  button.on { color: #14161b; background: #f2c230; border-color: #f2c230; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1440"></canvas>
<div class="bar">
  <button id="play">播放</button>
  <button id="rec">录制视频</button>
  <button id="wav">导出音频</button>
</div>

<script src="engine.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// 这首歌：《或许》—— city pop，三幕（舒展 → 卡住 → 打开）
// 做新歌时：整段替换下面的内容。底座 engine.js 不动。
// ═══════════════════════════════════════════════════════════════════

// ── 1. 和弦：n = 电钢琴弹的四个音，b = 贝斯的根音，name = 画面右上角显示的名字 ──
const F     = { name: 'Fmaj7',   n: [53, 57, 60, 64], b: 41 };
const E7    = { name: 'E7',      n: [52, 56, 59, 62], b: 40 };
const Am    = { name: 'Am7',     n: [57, 60, 64, 67], b: 45 };
const Gm    = { name: 'Gm7',     n: [55, 58, 62, 65], b: 43 };
const C7    = { name: 'C7',      n: [55, 58, 60, 64], b: 36 };
const Am9   = { name: 'Am9',     n: [55, 59, 60, 64], b: 45 };
const D9    = { name: 'D9',      n: [54, 57, 60, 64], b: 38 };
const Fsm7b5 = { name: 'F#m7♭5', n: [54, 57, 60, 64], b: 42 };
const B7    = { name: 'B7',      n: [54, 57, 59, 63], b: 47 };
const Asus  = { name: 'A9sus',   n: [55, 59, 62, 64], b: 45 };
const Em7   = { name: 'Em7',     n: [55, 59, 62, 64], b: 40 };
const A7    = { name: 'A7',      n: [55, 57, 61, 64], b: 45 };
const Dmaj9 = { name: 'Dmaj9',   n: [54, 57, 61, 64], b: 38 };
const tr = (c, k, name) => ({ name, n: c.n.map(x => x + k), b: c.b + k });   // 整体升 k 个半音
const G = tr(F, 2, 'Gmaj7');
const LOOP  = [[F, F], [E7, E7], [Am, Am], [Gm, C7]];                         // 每小节 [前半, 后半]
const LOOP2 = [[G, G], [tr(E7, 2, 'F#7'), tr(E7, 2, 'F#7')], [tr(Am, 2, 'Bm7'), tr(Am, 2, 'Bm7')], [tr(Gm, 2, 'Am7'), tr(C7, 2, 'D7')]];

function chordAt(bar) {
  if (bar < 12) return LOOP[bar % 4];                            // 前奏 + 第一幕
  if (bar === 16) return [Fsm7b5, Fsm7b5];                       // 第二幕第三遍：换更暗的和弦
  if (bar === 17) return [B7, B7];
  if (bar < 20) return bar % 2 === 0 ? [Am9, Am9] : [D9, D9];    // 第二幕：两个和弦来回，不解决
  if (bar === 20) return [Asus, Asus];                           // 过门
  if (bar === 28) return [Em7, A7];
  if (bar < 29) return LOOP2[(bar - 21) % 4];                    // 第三幕：升一个全音
  return bar === 30 ? [G, G] : [Dmaj9, Dmaj9];                   // 尾奏：落回主和弦
}

// ── 2. 旋律：[小节偏移, 十六分位(0–15), 音高(60=中央C), 时值(十六分音符个数)] ──
const PH_A1 = [
  [0, 2, 69, 2], [0, 4, 72, 2], [0, 6, 76, 4], [0, 10, 74, 2], [0, 12, 72, 4],
  [1, 0, 71, 6], [1, 6, 68, 2], [1, 8, 71, 7],
  [2, 2, 69, 2], [2, 4, 72, 2], [2, 6, 76, 4], [2, 10, 79, 2], [2, 12, 76, 4],
  [3, 0, 74, 6], [3, 6, 70, 2], [3, 8, 72, 7],
];
const PH_A2 = [
  [0, 2, 69, 2], [0, 4, 72, 2], [0, 6, 76, 4], [0, 10, 74, 2], [0, 12, 72, 4],
  [1, 0, 71, 6], [1, 6, 68, 2], [1, 8, 71, 7],
  [2, 2, 69, 2], [2, 4, 72, 2], [2, 6, 76, 4], [2, 10, 79, 2], [2, 12, 81, 4],
  [3, 0, 79, 6], [3, 6, 77, 2], [3, 8, 76, 7],
];
// 「卡住」：同一句，每次落点更低，最后一次没唱完
const phB = land => [
  [0, 0, 76, 3], [0, 3, 74, 3], [0, 6, 72, 2], [0, 8, 69, 6],
  [1, 0, 72, 3], [1, 3, 71, 3], [1, 6, 69, 2], [1, 8, land, 6],
];
const PH_B_BROKEN = [[0, 0, 76, 3], [0, 3, 74, 3], [0, 6, 72, 3]];
// 「打开」：新的、一路向上的旋律
const PH_C2 = [
  [0, 2, 78, 2], [0, 4, 81, 2], [0, 6, 83, 4], [0, 10, 81, 2], [0, 12, 86, 4],
  [1, 0, 85, 6], [1, 6, 82, 2], [1, 8, 85, 3], [1, 12, 88, 4],
  [2, 0, 90, 5], [2, 6, 88, 2], [2, 8, 86, 3], [2, 12, 83, 4],
  [3, 0, 83, 4], [3, 4, 79, 2], [3, 6, 81, 2], [3, 8, 85, 4], [3, 12, 81, 4],
];
const PH_OUT = [[0, 0, 78, 10], [1, 0, 74, 3], [1, 4, 78, 3], [1, 8, 81, 8], [2, 0, 78, 16]];
const PINGS = [[0, 8], [0, 11], [1, 8], [1, 11], [2, 8], [2, 11], [3, 8], [3, 11], [19, 8],
               [20, 0], [20, 4], [29, 8], [29, 11], [30, 8], [30, 11], [31, 8], [31, 11], [32, 8], [32, 11], [33, 0]];

// ── 3. 编曲：每一小节谁在弹什么 ──
function arrange(k) {
  const { T, S16, BAR, END_BAR, tone, ep, bass, pad, bell, ping, kick, snare, hat, rim, breath, roll, stab, melody } = k;

  // 第二幕整体越来越闷；过门那一小节擦亮
  tone.frequency.setValueAtTime(18000, T(12));
  tone.frequency.exponentialRampToValueAtTime(650, T(20));
  tone.frequency.exponentialRampToValueAtTime(18000, T(21));

  for (let bar = 0; bar < END_BAR; bar++) {
    const [h1, h2] = chordAt(bar), next = bar + 1 < END_BAR ? chordAt(bar + 1)[0] : h2;
    const inA = bar >= 4 && bar < 12, inB = bar >= 12 && bar < 20, inC = bar >= 21 && bar < 29;
    const fading = bar >= 18 && bar < 20;

    // 电钢琴
    if (inA || inC) { stab(bar, 0, h1, 5, 0.9); stab(bar, 6, h1, 2, 0.7); stab(bar, 10, h2, 3, 0.8); stab(bar, 14, next, 2, 0.75); }
    else if (inB) { stab(bar, 0, h1, 6, 0.75); if (!fading) stab(bar, 10, h2, 4, 0.6); }
    else roll(bar, h1, 15, bar >= 29 ? 0.8 : 0.85);

    // 贝斯
    if (inA || inC) {
      [[0, h1.b, 3], [3, h1.b + 12, 1], [6, h1.b, 2], [8, h2.b, 3], [11, h2.b + 7, 1], [12, h2.b + 12, 2], [14, h2.b + 7, 2]]
        .forEach(([s, m, l]) => bass(T(bar, s), m, l * S16 * 0.9, s % 4 === 3 ? 0.7 : 1));
    } else if (inB) {
      if (fading) bass(T(bar), h1.b, 8 * S16, 0.8);
      else [[0, h1.b, 6], [10, h1.b, 2], [12, h1.b + 7, 3]].forEach(([s, m, l]) => bass(T(bar, s), m, l * S16 * 0.9));
    } else if (bar >= 29) bass(T(bar), h1.b, 14 * S16, 0.7);

    // 鼓
    if (inA || inC) {
      [0, 7, 10].forEach(s => kick(T(bar, s), s === 7 ? 0.7 : 1));
      [4, 12].forEach(s => snare(T(bar, s)));
      if (inC) for (let s = 0; s < 16; s++) hat(T(bar, s), s === 14 ? 0.9 : s % 4 === 0 ? 0.8 : s % 2 === 0 ? 0.55 : 0.3, s === 14 ? 0.28 : 0.045);
      else for (let s = 0; s < 16; s += 2) hat(T(bar, s), s === 14 && bar % 2 ? 0.8 : s % 4 === 0 ? 0.6 : 0.4, s === 14 && bar % 2 ? 0.28 : 0.045);
    } else if (inB) {
      if (!fading) [0, 10].forEach(s => kick(T(bar, s), 0.8));
      [4, 12].forEach(s => rim(T(bar, s), fading ? 0.6 : 0.9));
      for (let s = 0; s < 16; s += 2) hat(T(bar, s), 0.3);
    }
    if (bar === 3) { snare(T(3, 12), 0.5); snare(T(3, 14), 0.75); }
    if (bar === 20) {
      [[8, 0.3], [10, 0.45], [12, 0.6], [13, 0.7], [14, 0.8], [15, 0.95]].forEach(([s, v]) => snare(T(20, s), v));
      breath(T(20), BAR, 0.5, 500, 6000);
    }
    if (bar === 21 || bar === 25) hat(T(bar), 1.2, 1.6);
    if (bar === 24) [[13, 0.5], [14, 0.7], [15, 0.9]].forEach(([s, v]) => snare(T(24, s), v));
    if (bar === 28) [[13, 0.6], [14, 0.8], [15, 1]].forEach(([s, v]) => snare(T(28, s), v));
    if (bar >= 25 && bar < 29) [3, 15].forEach(s => bass(T(bar, s), (s === 3 ? h1 : h2).b + 12, S16 * 0.8, 0.8));

    // 第三幕的铺底与闪光
    if (inC) {
      h1.n.forEach(m => pad(T(bar), m + 12, 7.5 * S16));
      h2.n.forEach(m => pad(T(bar, 8), m + 12, 7.5 * S16));
      for (let s = 0; s < 16; s += 2) { const c = s < 8 ? h1 : h2; bell(T(bar, s), c.n[[0, 2, 1, 3][(s / 2) % 4]] + 24, bar < 25 ? 0.45 : 0.75); }
    }
    if (bar >= 29) h1.n.forEach(m => pad(T(bar), m + 12, 15 * S16, 0.8));
  }

  melody(4, PH_A1, 0, 0.9); melody(8, PH_A2, 0, 1);
  melody(12, phB(66), 0, 0.95); melody(14, phB(64), 0, 0.82); melody(16, phB(63), 0, 0.7);
  melody(18, PH_B_BROKEN, 0, 0.5);
  melody(21, PH_A1, 2, 1); melody(25, PH_C2, 0, 0.85); melody(25, PH_C2, -12, 0.45, true);
  melody(29, PH_OUT, 0, 0.9);

  PINGS.forEach(([b, s]) => ping(T(b, s), b >= 29 ? 90 : 88));
  breath(T(8), 1.6, 0.35, 900, 1400);
}

// ── 4. 画纸：一根线画到底，笔的位置由主旋律决定（画纸坐标 1000 × 730）──
const INK = [26, 26, 26], GOLD = [204, 140, 0], KX = 540, KY0 = 380;
function path({ ev, BAR, HZ, END_BAR }) {
  const out = [], lead = ev.lead, pingT = PINGS.map(([b, s]) => (b + s / 16) * BAR);
  let sp = 72, tgt = 72, li = 0, px = 60, py = 560;
  const N = Math.ceil((END_BAR + 0.7) * BAR * HZ);
  for (let i = 0; i <= N; i++) {
    const t = i / HZ, b = t / BAR;
    while (li < lead.length && lead[li].t <= t) tgt = lead[li++].m;
    sp += (tgt - sp) * Math.min(1, 3.5 / HZ);               // 笔跟着音高走，但有惯性，所以是曲线不是台阶
    let tx, ty, w;
    if (b < 4) {                       // 前奏：一条平线，信号来时跳一下
      let blip = 0;
      for (const pt of pingT) { const d = t - pt; if (d >= 0 && d < 0.22) blip = 30 * Math.sin(Math.PI * d / 0.22); }
      tx = 60 + (b / 4) * 90; ty = 560 - blip; w = 2.6;
    } else if (b < 12) {               // 第一幕：流畅地向上舒展
      const u = (b - 4) / 8, v = 1 - u;
      tx = v * v * 150 + 2 * u * v * 330 + u * u * KX;
      ty = v * v * 560 + 2 * u * v * 20 + u * u * (KY0 - 10) - (sp - 72) * 11; w = 3.4;
    } else if (b < 20) {               // 第二幕：原地缠绕，越缠越小越黑
      const rep = Math.floor((b - 12) / 2), ph = ((b - 12) % 2) / 2;
      const th = 6.2832 * 3 * ph + rep * 0.9, rot = rep * 0.6;
      const live = b < 18.7 ? 1 : Math.max(0.06, 1 - (b - 18.7));
      const r = (55 + (sp - 63) * 5) * [1, 0.85, 0.7, 0.55][rep] * live;
      const ex = r * 1.25 * Math.cos(th), ey = r * 0.8 * Math.sin(th), jit = (3 + rep * 3.5) * live;
      tx = KX + ex * Math.cos(rot) - ey * Math.sin(rot) + jit * Math.sin(t * 31);
      ty = KY0 + ex * Math.sin(rot) + ey * Math.cos(rot) + jit * Math.sin(t * 27 + 2); w = 2.8 + rep * 0.6;
    } else {                           // 第三幕：从结里一圈圈向外展开
      const v = clamp((b - 20.5) / 8.5);
      const r = 24 + 266 * Math.pow(v, 0.8) + (sp - 80) * 3.2 * Math.min(1, v * 3);
      const turns = b < 29 ? (b - 20.5) / 2 : 4.25 + 0.6 * (1 - Math.exp(-(b - 29) / 2));
      const th = -Math.PI / 2 + 6.2832 * turns;
      tx = KX + r * Math.cos(th); ty = KY0 + r * Math.sin(th) * 0.98;
      w = 4.2 * (1 - 0.9 * ramp(b, 30, 33.6));
    }
    if (i === 0) { px = tx; py = ty; }
    px += (tx - px) * Math.min(1, 16 / HZ); py += (ty - py) * Math.min(1, 16 / HZ);
    out.push([px + Math.sin(t * 23) * 0.8 + Math.sin(t * 37 + 1) * 0.6, py + Math.sin(t * 29 + 3) * 0.8,   // 一点手抖
              w * (0.85 + 0.25 * Math.sin(t * 11)), rgb(mix(INK, GOLD, ramp(b, 20.6, 21.2)))]);
  }
  return out;
}
// 铃声：线旁边溅出的小点
function dots({ ev, HZ }, P) {
  const rnd = rng(26);
  return ev.bell.map(n => {
    const p = P[Math.min(P.length - 1, Math.round(n.t * HZ))], a = Math.atan2(p[1] - KY0, p[0] - KX) + (rnd() - 0.5) * 0.5, d = 16 + rnd() * 44;
    return { t: n.t, x: p[0] + Math.cos(a) * d, y: p[1] + Math.sin(a) * d, r: 2 + rnd() * 3 };
  });
}

// ── 5. 交给底座 ──
createEngine({
  title: '或许', tag: 'City Pop', bpm: 100, swing: 0.12, endBar: 33, tail: 4, volume: 0.5,
  sections: [['前奏', 4], ['第一幕', 12], ['第二幕', 20], ['过门', 21], ['第三幕', 29], ['尾奏', 33]],
  chordAt, arrange,
  art: lineArt({ path, dots, dotColor: GOLD }), badge: [KX, KY0],
  // 音符区的底色跟着情绪走：冷的蓝灰 → 起雾的灰 → 暖黄
  rollColor: b => b < 11.6 ? [201, 214, 227] : b < 12.2 ? mix([201, 214, 227], [222, 217, 206], ramp(b, 11.6, 12.2))
    : b < 20.4 ? mix([222, 217, 206], [190, 187, 180], ramp(b, 12.2, 20)) : mix([190, 187, 180], [246, 227, 161], ease(ramp(b, 20.4, 21))),
  // 第二幕：音符区起雾，过门时从左到右擦亮
  rollOverlay(g, b, r) {
    const frost = 0.62 * ramp(b, 12, 20);
    if (frost > 0 && b < 21) { const x0 = r.x + r.w * ease(ramp(b, 20, 21)); g.fillStyle = `rgba(232,230,224,${frost})`; g.fillRect(x0, r.y, r.x + r.w - x0, r.h); }
  },
});
</script>
</body>
</html>
